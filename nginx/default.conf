# Nginx Static Site & Reverse Proxy Lab
# 本檔由官方 Nginx Image 的 nginx.conf 載入，位於 http context。
# 對外入口：localhost:8080 (Compose 映射至 Nginx :80)

# ------------------------------------------------------------
# 1. JSON Access Log（輸出至 stdout，方便 docker compose logs）
# ------------------------------------------------------------
log_format project05 escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"host":"$host",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"gzip_ratio":"$gzip_ratio",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
    '}';

# ------------------------------------------------------------
# 2. Rate Limiting：依 Client IP 限制平均每秒 2 個 Request
# ------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=lab_rate:10m rate=2r/s;

# ------------------------------------------------------------
# 3. Load Balancing：兩個 API Instance，預設 Round Robin
# ------------------------------------------------------------
upstream lab_backend {
    server api1:3000;
    server api2:3000;
}

# ------------------------------------------------------------
# 4. HTTP Server
# ------------------------------------------------------------
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout project05;
    error_log /dev/stderr warn;

    # 所有 proxy_pass 路由共用的 Headers。
    # location 若自行宣告 proxy_set_header，需注意繼承規則。
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --------------------------------------------------------
    # Healthcheck
    # --------------------------------------------------------

    # 只檢查 Nginx 自身是否正常，Compose Healthcheck 使用此路由。
    location = /health/live {
        access_log off;
        default_type text/plain;
        return 200 "nginx alive\n";
    }

    # 檢查主 API；不涵蓋 Load Balancing 的 api1、api2。
    location = /health/ready {
        proxy_pass http://api:3000/health;
    }

    # --------------------------------------------------------
    # Lab 1：Gzip - /lab/gzip/large.txt
    # --------------------------------------------------------
    location /lab/gzip/ {
        gzip on;
        gzip_min_length 100;
        gzip_types text/plain;
        gzip_vary on;
        try_files $uri =404;
    }

    # --------------------------------------------------------
    # Lab 2：Browser Cache - /lab/cache/cache.css
    # --------------------------------------------------------
    location /lab/cache/ {
        expires 1h;                         # Cache-Control: max-age=3600
        add_header X-Lab-Cache "enabled" always;
        try_files $uri =404;
    }

    # --------------------------------------------------------
    # Lab 3：Proxy Timeout - /lab/timeout?seconds=2|5
    # --------------------------------------------------------
    location = /lab/timeout {
        proxy_connect_timeout 2s;           # 建立 upstream 連線的逾時
        proxy_send_timeout 3s;              # 傳送請求的相鄰寫入間隔逾時
        proxy_read_timeout 3s;              # 讀取回應的相鄰讀取間隔逾時
        proxy_pass http://api:3000;         # 保留原始 URI 與 Query String
    }

    # --------------------------------------------------------
    # Lab 4：Rate Limit - /lab/rate
    # --------------------------------------------------------
    location = /lab/rate {
        limit_req zone=lab_rate burst=3 nodelay;
        limit_req_status 429;               # 超過限制回傳 Too Many Requests
        proxy_pass http://api:3000;
    }

    # --------------------------------------------------------
    # Lab 5：Load Balancing - /lab/balance
    # --------------------------------------------------------
    location = /lab/balance {
        proxy_pass http://lab_backend;
    }

    # --------------------------------------------------------
    # 一般 API 與靜態網站
    # --------------------------------------------------------
    location /api/ {
        proxy_pass http://api:3000;         # 保留 /api/* 路徑
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /docs/ {
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # --------------------------------------------------------
    # 自訂錯誤頁面（只能經由 Nginx 內部轉向使用）
    # --------------------------------------------------------
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}